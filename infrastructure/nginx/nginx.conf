events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;

  upstream web { server web:3000; }
  upstream api { server api:4000; }
  upstream admin { server admin:3001; }

  server {
    # Plain HTTP on purpose: this file is the local/reference edge. In production, terminate
    # TLS in front of it (a managed load balancer) or add a `listen 443 ssl` block with
    # certificates, and add `Strict-Transport-Security` there — HSTS must only ever be sent
    # over HTTPS. If a load balancer sits in front, set TRUST_PROXY_HOPS=2 on the API.
    listen 80;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
      limit_req zone=public_api burst=40 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Appends the address nginx itself saw to any client-supplied value. The API trusts
      # only the entries our own proxies add (TRUST_PROXY_HOPS), never the client's.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    # Only the liveness alias is public. Readiness (/health/ready, which reports which
    # dependency is down) is deliberately NOT proxied: probes reach the API directly on the
    # private network, and outsiders learn nothing about internal dependencies.
    location = /health { proxy_pass http://api; }
    location /admin { proxy_pass http://admin; proxy_set_header Host $host; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
